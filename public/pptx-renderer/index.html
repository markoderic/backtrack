<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Backtrack PowerPoint renderer</title>
    <style>
      html, body { margin: 0; background: #fff; }
      /* Text with no font of its own is sans serif, like PowerPoint's default. */
      body { font-family: Calibri, Arial, Helvetica, "Liberation Sans", sans-serif; }
      #host { width: 1920px; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script src="render.js"></script>
  </body>
</html>
